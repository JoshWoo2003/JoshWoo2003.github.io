title:
first_name: Yusen
middle_name:
last_name: Wu
description: >
  PhD student at UVA. Research in ML systems and cloud computing.
keywords: [academic-website, portfolio]
lang: en
icon: "⚛️"

url: "https://JoshWoo2003.github.io"
baseurl: ""

back_to_top: true
last_updated: false

remote_theme: alshedivat/al-folio

navbar_fixed: true
footer_fixed: true
search_enabled: true

blog_name: "Blog"
blog_description: "notes"
permalink: /blog/:year/:title/

pagination:
  enabled: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jemoji

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

include: ["_pages"]

keep_files:
  - CNAME
  - .nojekyll

enable_darkmode: true
enable_math: false
enable_masonry: false
enable_medium_zoom: false
enable_project_categories: false

enable_google_analytics: false
enable_cronitor_analytics: false
enable_pirsch_analytics: false
enable_openpanel_analytics: false
enable_google_verification: false
enable_bing_verification: false

navigation:
